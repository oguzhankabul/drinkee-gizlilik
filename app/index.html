<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drinkee Cadde — Uygulamayı İndir</title>
<style>
  :root { --green:#1E4A2F; --cream:#F2EFE4; --mustard:#F5B91E; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--green); color:var(--cream); font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; text-align:center; }
  .card { padding:32px 24px; max-width:420px; display:none; }
  .card.show { display:block; }
  h1 { font-size:28px; margin:0 0 8px; }
  p { margin:0 0 28px; opacity:.85; }
  a.btn { display:block; margin:12px auto; padding:16px 20px; max-width:280px; border-radius:14px;
          background:var(--cream); color:var(--green); font-weight:700; font-size:17px; text-decoration:none; }
  a.btn.play { background:var(--mustard); color:#1a1a1a; }
  .small { font-size:12px; opacity:.6; margin-top:24px; }
</style>
<script>
  (function () {
    var ua = navigator.userAgent || "";
    var ios = "https://apps.apple.com/tr/app/drinkee-cadde/id6815608239";
    var android = "https://play.google.com/store/apps/details?id=com.drinkee.cadde";
    if (/android/i.test(ua)) { location.replace(android); }
    else if (/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && "ontouchend" in document)) { location.replace(ios); }
    else {
      // Yalnız telefon dışı cihazlarda görünür bir seçim sayfası çiz.
      document.addEventListener("DOMContentLoaded", function () {
        document.querySelector(".card").classList.add("show");
      });
    }
  })();
</script>
</head>
<body>
  <noscript><style>.card{display:block}</style></noscript>
  <div class="card">
    <h1>Drinkee Cadde</h1>
    <p>5 yıldız topla, kahven bizden. Uygulamayı indir:</p>
    <a class="btn" href="https://apps.apple.com/tr/app/drinkee-cadde/id6815608239">&#63743; App Store'dan indir</a>
    <a class="btn play" href="https://play.google.com/store/apps/details?id=com.drinkee.cadde">▶ Google Play'den indir</a>
    <div class="small">Drinkee Coffee Roastery — Cadde · Bostancı</div>
  </div>
</body>
</html>
